<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenhouse Sensor Logger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Greenhouse Sensor Logger</h1>
    <nav aria-label="Primary">
      <a href="#record-section">Record</a>
      <a href="#log-section">Logs</a>
    </nav>
  </header>

  <main>
    <section id="record-section" aria-labelledby="record-heading">
      <h2 id="record-heading">Record Reading</h2>

      <form id="reading-form" novalidate>
        <div id="form-alert" class="form-alert" role="alert" hidden></div>

        <div class="field">
          <label for="bay">Greenhouse Bay</label>
          <select id="bay" required>
            <option value="">Select a bay</option>
            <option value="Bay 1">Bay 1</option>
            <option value="Bay 2">Bay 2</option>
            <option value="Bay 3">Bay 3</option>
            <option value="Bay 4">Bay 4</option>
            <option value="Bay 5">Bay 5</option>
            <option value="Bay 6">Bay 6</option>
          </select>
          <small class="error-msg"></small>
        </div>
<div class="field">
          <label for="ph">pH (unitless)</label>
          <input id="ph" type="number" min="0" max="14" step="0.1" required placeholder="e.g. 6.2" inputmode="decimal">
          <small class="hint">Allowed range: 0 to 14</small>
          <small class="error-msg"></small>
        </div>

        <div class="field">
          <label for="ec">EC (mS/cm)</label>
          <input id="ec" type="number" min="0" max="20" step="0.01" required placeholder="e.g. 1.5" inputmode="decimal">
          <small class="hint">Allowed range: 0 to 20</small>
          <small class="error-msg"></small>
        </div>

        <div class="field">
          <label for="temp">Air Temperature</label>
          <div class="input-row">
            <input id="temp" type="number" min="0" max="150" step="0.1" required placeholder="e.g. 68" inputmode="decimal">
            <select id="temp-unit" aria-label="Temperature unit">
              <option value="F">°F</option>
              <option value="C">°C</option>
            </select>
          </div>
          <small class="hint" id="temp-hint">Allowed range: 0 to 150 °F</small>
          <small class="error-msg"></small>
        </div>

        <div class="field">
          <label for="rh">Relative Humidity (%)</label>
          <input id="rh" type="number" min="0" max="100" step="1" required placeholder="e.g. 60" inputmode="numeric">
          <small class="hint">Allowed range: 0 to 100</small>
          <small class="error-msg"></small>
        </div>

        <button type="submit" id="btn-record">Record Reading</button>
      </form>
    </section>

    <section id="log-section" aria-labelledby="log-heading">
      <header class="log-header">
        <h2 id="log-heading">Telemetry Log <span id="count-badge" class="badge" aria-label="0 readings">0</span></h2>
        <button id="btn-purge" type="button">Purge All Logs</button>
      </header>

      <section id="status-banner" role="status" aria-live="polite" hidden></section>

      <section id="log-list" aria-label="Logged readings"></section>
    </section>
  </main>

  <footer>
    <p>Assignment 2B &ndash; System 2: Greenhouse Sensor Logger UI &ndash; Quentin Loree</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
